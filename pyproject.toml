[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-radar"
version = "0.1.0"
description = "Local-first daily research radar for the terminal. Scans GitHub, Hugging Face and arXiv against your own interests and ranks results with a local Ollama model."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["tui", "ollama", "local-first", "arxiv", "github", "huggingface", "research"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
radar = "research_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
