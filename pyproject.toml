[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-radar"
# The version lives in src/research_radar/__init__.py only. The update check reads it there.
dynamic = ["version"]
description = "Local-first daily research radar. Scans GitHub, arXiv, Hugging Face and Codeberg for your interests, ranks and summarises with a local Ollama model, and sends a digest by email or Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["tui", "ollama", "local-first", "arxiv", "github", "huggingface", "codeberg", "research", "digest", "telegram"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=6.2",  # Binding groups in the footer
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
radar = "research_radar.cli:main"

[tool.hatch.version]
path = "src/research_radar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/research_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
