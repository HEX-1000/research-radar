# Research Radar: your interests.
#
# This file is the whole guide. Edit it, add topics, remove topics. Nothing in
# here ever leaves your computer. `radar init` copies it to your data home.
#
# The two topics at the end are invented examples that show the format. They
# are nobody's interests. Replace both with your own before the first scan.
#
# How a scan works: each source fetches new items for your topics, a local
# embedding model scores every item against the topic descriptions below, and
# only the best few are summarised by a local chat model. Write the
# description of a topic the way you would explain it to a colleague: what you
# work on, which tools you use, what you want to hear about.

settings:
  ollama_url: http://localhost:11434
  embed_model: nomic-embed-text   # embeddinggemma also works; if you change it, re-tune min_score
  chat_model: ""            # empty = use the first installed non-embedding model
  summary_language: English
  min_score: 0.55           # lower it to see more, raise it to see less (try: radar scan --explain)
  max_items: 8              # per scan, all topics together
  max_per_topic: 3
  first_run_days: 3         # how far back the very first scan looks
  max_catchup_days: 14      # a long break never fetches more than this
  auto_scan_on_launch: true # the TUI catches up when you open it
  auto_update: true         # look for a newer version on GitHub when the TUI opens
  trust_check: true         # hold back small, starred GitHub repositories from unfollowed accounts for a week
  theme: hex-amber          # colors of the terminal interface; try textual-dark, nord, gruvbox
  github_token_env: GITHUB_TOKEN   # name of the environment variable, optional
  # notes_dir: ~/research-radar-notes   # default: <data home>/notes

# Where the daily digest goes. Every scan writes an HTML page to <data home>/digests.
# Email and Telegram are optional. Passwords and tokens are never written here:
# put them in the environment variables named below.
delivery:
  html_file: true
  send_when_empty: false     # true = also send "nothing new today"
  retry_days: 3              # a message that failed to send is retried for this many days
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    security: starttls       # starttls, ssl or none
    username: you@example.com
    password_env: RADAR_SMTP_PASSWORD   # Gmail needs an app password
    to: you@example.com
  telegram:
    enabled: false
    token_env: RADAR_TELEGRAM_TOKEN
    chat_id: ""              # `radar telegram-chat` shows it

# Phrases that drop an item from every topic. They match anywhere in the text.
# Repositories that offer cracked software or keygens are dropped without being listed here.
exclude:
  - telemetry enabled by default
  - cracked
  - license bypass

sources:
  github:
    enabled: true
    min_stars: 5
  arxiv:
    enabled: true
  huggingface-papers:
    enabled: true
  huggingface-models:  # trending models, matched on tags only; turn on if your topics are about models
    enabled: false
    limit: 25
  feeds:               # Atom and RSS; reads nothing until a topic lists a feed (see the topics below)
    enabled: true
  forgejo:             # Codeberg and any Gitea or Forgejo server share one API
    enabled: true
    instances: [codeberg.org]
    token_env:         # Codeberg answers searches only with an access token, see the README
      codeberg.org: RADAR_CODEBERG_TOKEN

# EXAMPLE TOPICS. Both are invented to show the format; replace them with your own.
# While they are unchanged the app says so and does not start a scan by itself.
topics:
  - name: "Example: Web accessibility tools"
    description: >
      Tools that find and fix accessibility problems in websites and apps.
      Automated WCAG checkers, screen reader testing, color contrast and
      keyboard navigation checks, accessible component libraries, and tools
      that write captions and image descriptions.
    # Keywords of four letters or fewer match whole words (wcag, not wcagx); longer ones
    # match the start of a word (screen reader also finds screen readers).
    keywords: [accessibility, wcag, screen reader, color contrast, alt text]
    exclude: [accessibility overlay]
    # Optional: feeds. `watch` shows what appears there without a bar (GitHub owner/name means its
    # releases feed; a repository without releases needs its .../commits.atom URL). `feeds: urls:`
    # lists blogs whose posts are scored like any other item.
    # watch:
    #   - dequelabs/axe-core
    #   - https://github.com/nvaccess/nvda/commits.atom
    # feeds:
    #   urls: [https://example.org/blog/feed.xml]
    # Optional, per topic: min_score and max_per_topic replace the values under settings for this
    # topic only (max_per_topic: 0 hides it). Leave them out until `radar scan --explain` shows a need.
    github:
      queries: [accessibility testing, wcag, screen reader]
    arxiv:
      categories: [cs.HC]
      terms: [accessibility, screen reader, assistive technology]

  - name: "Example: Protein structure prediction"
    description: >
      Machine learning for protein structure and design. Structure prediction
      models, protein language models, docking, open datasets and benchmarks,
      and tools that run these models on one workstation.
    keywords: [protein structure, protein folding, protein design, docking]
    github:
      queries: [protein structure prediction, protein design]
    arxiv:
      categories: [q-bio.BM, cs.LG]
      terms: [protein structure, protein design]
    forgejo:
      queries: [bioinformatics]
