name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run the tests
        shell: bash
        run: python -m pytest -q -rf --tb=short 2>&1 | tee pytest.log
      - name: Show the failures as annotations
        if: failure()
        shell: python
        run: |
          import pathlib
          text = pathlib.Path("pytest.log").read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=pytest::" + text)

  installer:
    name: install.ps1 on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the installer exactly as the README says
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
      - name: Check what it set up, and the daily task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Run([string]$text, [scriptblock]$command) {
              $out = (& $command | Out-String)
              if ($LASTEXITCODE -ne 0) { throw "failed: $text`n$out" }
              Write-Host $out
              return $out
          }
          $radar = ".\.venv\Scripts\radar.exe"
          Run "version" { & $radar --version } | Out-Null
          $before = Run "status before" { & $radar schedule status }
          if ($before -notmatch "No daily scan") { throw "expected no task yet: $before" }
          Run "schedule on" { & $radar schedule on --at 06:30 } | Out-Null
          $after = Run "status after" { & $radar schedule status }
          if ($after -notmatch "every day at 06:30") { throw "task not registered: $after" }
          Run "schedule off" { & $radar schedule off } | Out-Null
          $gone = Run "status gone" { & $radar schedule status }
          if ($gone -notmatch "No daily scan") { throw "task not removed: $gone" }
      - name: The installer can be run again
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
